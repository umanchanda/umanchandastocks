{% extends "layout.html" %}

{% block title %}Set New Password{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="form-card">
            <h4 class="mb-2 fw-bold">Set New Password</h4>
            <p class="text-muted mb-4 small">Choose a new password for your account.</p>
            <form action="/reset-password/{{ token }}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="password">New Password</label>
                    <input autofocus class="form-control" id="password" name="password" type="password" autocomplete="new-password" required/>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmation">Confirm New Password</label>
                    <input class="form-control" id="confirmation" name="confirmation" type="password" autocomplete="new-password" required/>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
