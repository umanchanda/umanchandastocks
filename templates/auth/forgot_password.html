{% extends "layout.html" %}

{% block title %}Forgot Password{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="form-card">
            <h4 class="mb-2 fw-bold">Reset Password</h4>
            <p class="text-muted mb-4 small">Enter your email address and we'll send you a link to reset your password.</p>
            <form action="/forgot-password" method="post">
                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input autofocus class="form-control" id="email" name="email" type="email" autocomplete="email" required/>
                </div>
                <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
            </form>
            <p class="text-center text-muted mt-3 mb-0 small"><a href="/login">Back to Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
