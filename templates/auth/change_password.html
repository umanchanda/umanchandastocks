{% extends "layout.html" %}

{% block title %}Change Password{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="form-card">
            <h4 class="mb-4 fw-bold">Change Password</h4>
            <form action="/change-password" method="post">
                <div class="mb-3">
                    <label class="form-label" for="current_password">Current Password</label>
                    <input autofocus class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">New Password</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required/>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmation">Confirm New Password</label>
                    <input class="form-control" id="confirmation" name="confirmation" type="password" autocomplete="new-password" required/>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
