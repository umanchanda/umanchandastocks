{% extends "layout.html" %}

{% block title %}Sell{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card">
            <h4 class="mb-4 fw-bold">Sell Stock</h4>
            {% if holdings %}
            <form action="/sell" method="post">
                <div class="mb-3">
                    <label class="form-label" for="symbol">Stock</label>
                    <select class="form-select" id="symbol" name="symbol" required>
                        <option disabled selected value="">Select a stock…</option>
                        {% for holding in holdings %}
                            <option value="{{ holding.symbol }}">{{ holding.symbol }} ({{ "%.4f" | format(holding.shares | float) }} shares)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="shares">Shares to Sell</label>
                    <input class="form-control" id="shares" name="shares" placeholder="e.g. 5 or 2.5" type="number" min="0.0001" step="any" required/>
                </div>
                <button class="btn btn-danger w-100 mt-2" type="submit">Sell</button>
            </form>
            {% else %}
            <p class="text-muted">You have no stock holdings to sell.</p>
            <a class="btn btn-primary" href="/buy">Buy Stocks</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
