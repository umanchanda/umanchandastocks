{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="form-card">
            <h4 class="mb-4 fw-bold">Log In</h4>
            <form action="/login" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input autofocus class="form-control" id="username" name="username" type="text" autocomplete="username" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required/>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">Log In</button>
            </form>
            <p class="text-center mt-3 mb-0 small"><a href="/forgot-password">Forgot your password?</a></p>
            <p class="text-center text-muted mt-2 mb-0 small">Don't have an account? <a href="/register">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
