{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="form-card">
            <h4 class="mb-4 fw-bold">Create Account</h4>
            <form action="/register" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input autofocus class="form-control" id="username" name="username" type="text" autocomplete="username" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required/>
                    <div class="form-text">Used only for password resets.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required/>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmation">Confirm Password</label>
                    <input class="form-control" id="confirmation" name="confirmation" type="password" autocomplete="new-password" required/>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">Create Account</button>
            </form>
            <p class="text-center text-muted mt-3 mb-0 small">Already have an account? <a href="/login">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
