{% extends "layout.html" %}

{% block title %}
    Buy
{% endblock %}

{% block main %}
    <form action="/buy" method="post">
        <div class="form-group">
            <input autocomplete="off" autofocus class="form-control" name="symbol" placeholder="Symbol" type="text"/>
        </div>

        <div class="btn-group btn-group-toggle mb-3 d-flex" data-toggle="buttons">
            <label class="btn btn-outline-primary active w-50">
                <input type="radio" name="mode" value="shares" checked> Shares
            </label>
            <label class="btn btn-outline-primary w-50">
                <input type="radio" name="mode" value="dollars"> Dollar Amount
            </label>
        </div>

        <div id="shares-input" class="form-group">
            <input autocomplete="off" class="form-control" name="shares" placeholder="Number of shares" type="number" min="0.0001" step="any"/>
        </div>
        <div id="dollars-input" class="form-group" style="display:none">
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text">$</span>
                </div>
                <input autocomplete="off" class="form-control" name="dollars" placeholder="Amount in USD" type="number" min="0.01" step="0.01"/>
            </div>
        </div>

        <button class="btn btn-primary" type="submit">Buy</button>
    </form>

    <script>
        document.querySelectorAll('input[name="mode"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                var isShares = this.value === 'shares';
                document.getElementById('shares-input').style.display = isShares ? '' : 'none';
                document.getElementById('dollars-input').style.display = isShares ? 'none' : '';
            });
        });
    </script>
{% endblock %}
