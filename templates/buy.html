{% extends "layout.html" %}

{% block title %}Buy{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card">
            <h4 class="mb-4 fw-bold">Buy Stock</h4>
            <form action="/buy" method="post">
                <div class="mb-3">
                    <label class="form-label" for="symbol">Ticker Symbol</label>
                    <input autofocus class="form-control text-uppercase" id="symbol" name="symbol" placeholder="e.g. AAPL" type="text" autocomplete="off" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Order Type</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="mode" id="mode-shares" value="shares" checked>
                        <label class="btn btn-outline-primary" for="mode-shares">By Shares</label>
                        <input type="radio" class="btn-check" name="mode" id="mode-dollars" value="dollars">
                        <label class="btn btn-outline-primary" for="mode-dollars">By Dollar Amount</label>
                    </div>
                </div>

                <div class="mb-3" id="shares-input">
                    <label class="form-label" for="shares">Number of Shares</label>
                    <input class="form-control" id="shares" name="shares" placeholder="e.g. 10 or 2.5" type="number" min="0.0001" step="any"/>
                </div>

                <div class="mb-3" id="dollars-input" style="display:none;">
                    <label class="form-label" for="dollars">Dollar Amount</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input class="form-control" id="dollars" name="dollars" placeholder="e.g. 500.00" type="number" min="0.01" step="0.01"/>
                    </div>
                </div>

                <button class="btn btn-success w-100 mt-2" type="submit">Buy</button>
            </form>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('input[name="mode"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        var isShares = this.value === 'shares';
        document.getElementById('shares-input').style.display = isShares ? '' : 'none';
        document.getElementById('dollars-input').style.display = isShares ? 'none' : '';
    });
});
</script>
{% endblock %}
